<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WiseCrowd · Prediction Markets</title>
    <meta name="description" content="Decentralized prediction markets: trade outcome shares, read crowd probabilities, resolve by arbitrator or reputation-weighted vote." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f5be0'/%3E%3Cpath d='M7 21l6-7 5 4 7-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
    <script>
      // apply the saved / OS theme before first paint
      (function () {
        var t = null;
        try { t = localStorage.getItem("wc.theme"); } catch (e) {}
        if (!t) t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="#/" aria-label="WiseCrowd home">
          <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M7 21l6-7 5 4 7-9" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="brand-name">WiseCrowd</span>
        </a>
        <nav class="nav" id="nav">
          <a href="#/" data-route="markets">Markets</a>
          <a href="#/portfolio" data-route="portfolio">Portfolio</a>
          <a href="#/create" data-route="create">Create</a>
          <a href="#/reporters" data-route="reporters">Reporters</a>
          <a href="#/wallet" data-route="wallet">Wallet</a>
        </nav>
        <div class="topbar-right">
          <div class="chain-pill" id="chain-pill" title="Latest block timestamp — the app reasons about chain time">
            <span class="dot"></span><span id="chain-name">…</span><span class="sep">·</span><span id="chain-clock">—</span>
          </div>
          <button class="icon-btn" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          </button>
          <div class="wallet" id="wallet"></div>
        </div>
      </div>
      <div class="banner" id="banner" hidden></div>
    </header>
    <main id="app" class="container" aria-live="polite">
      <div class="loading">Loading…</div>
    </main>
    <div id="devtools"></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <script src="vendor/ethers.umd.min.js"></script>
    <script src="config.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
